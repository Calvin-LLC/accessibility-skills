<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orientation lock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="900">
<style>
	body { margin: 0; font: 16px/1.5 sans-serif; padding: 16px; }
	.orient { display: none; }
	@media (orientation: landscape) and (max-width: 900px) { .orient { display: block; } .rest { display: none; } }
</style>
</head>
<body>
<main>
<div class="orient">Please rotate your device to portrait.</div>
<div class="rest"><h1>Portrait only</h1><p>Enough body copy to make the two orientations differ by a wide margin when the rotate message replaces it. Enough body copy to make the two orientations differ by a wide margin when the rotate message replaces it.</p></div>
</main>
</body>
</html>
